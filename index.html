<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Torre DCH 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4efe6; --ink-2:rgba(244,239,230,.68); --ink-3:rgba(244,239,230,.42);
    --panel:rgba(16,18,22,.62); --panel-2:rgba(16,18,22,.82); --line:rgba(255,255,255,.12);
    --accent:#ffc670; --accent-2:#ffdfa8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1015;color:var(--ink);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  #app canvas{display:block}
  #labels{position:fixed;inset:0;pointer-events:none}
  .glass{background:var(--panel);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  button{font:inherit;color:inherit;cursor:pointer}

  /* marca */
  #brand{position:fixed;left:20px;top:18px;padding:12px 16px;pointer-events:none}
  #brand .eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  #brand h1{margin:3px 0 0;font-size:18px;font-weight:700;letter-spacing:-.01em}
  #brand p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}

  /* horario */
  #time{position:fixed;right:20px;top:18px;display:flex;gap:2px;padding:4px}
  #time button{background:none;border:0;padding:7px 12px;border-radius:10px;font-size:12.5px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:6px}
  #time button:hover{color:var(--ink);background:rgba(255,255,255,.06)}
  #time button.on{background:rgba(255,198,112,.16);color:var(--accent-2)}
  #time svg{width:14px;height:14px}

  /* lista de andares */
  #floors{position:fixed;right:20px;top:50%;transform:translateY(-50%);padding:8px;display:flex;flex-direction:column;gap:2px;min-width:178px}
  #floors .ttl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);padding:6px 10px 6px}
  #floors button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:9px;padding:6px 10px;text-align:left;transition:background .15s,color .15s}
  #floors button .n{width:26px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.07);color:var(--ink-2);transition:all .15s}
  #floors button .l{font-size:12.5px;font-weight:500;color:var(--ink-2)}
  #floors button .s{font-size:10.5px;color:var(--ink-3);margin-left:auto}
  #floors button:hover,#floors button.hov{background:rgba(255,198,112,.12)}
  #floors button:hover .n,#floors button.hov .n{background:var(--accent);color:#1b1408}
  #floors button:hover .l,#floors button.hov .l{color:var(--ink)}
  #floors button.sel{background:rgba(255,198,112,.2)}
  #floors button.sel .n{background:var(--accent);color:#1b1408}
  #floors button.sel .l{color:var(--accent-2)}

  /* dica */
  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 16px;font-size:12.5px;color:var(--ink-2);display:flex;gap:14px;align-items:center;transition:opacity .4s;white-space:nowrap}
  #hint b{color:var(--ink);font-weight:600}
  #hint .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}

  /* tooltip */
  #tip{position:fixed;left:0;top:0;pointer-events:none;padding:9px 12px;background:var(--panel-2);border:1px solid rgba(255,198,112,.45);border-radius:10px;font-size:12px;opacity:0;transform:translate(16px,16px) scale(.96);transition:opacity .15s,transform .15s;white-space:nowrap;z-index:5}
  #tip.on{opacity:1;transform:translate(16px,16px) scale(1)}
  #tip b{display:block;font-size:13.5px;color:var(--accent-2);margin-bottom:2px}
  #tip span{color:var(--ink-2)}
  #tip i{display:block;font-style:normal;color:var(--ink-3);font-size:11px;margin-top:4px}

  /* painel do andar */
  #info{position:fixed;left:20px;bottom:20px;width:318px;padding:18px 18px 14px;opacity:0;transform:translateX(-20px);pointer-events:none;transition:opacity .5s,transform .5s}
  #info.on{opacity:1;transform:none;pointer-events:auto}
  #info .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  #info h2{margin:4px 0 2px;font-size:22px;letter-spacing:-.01em}
  #info .sub{font-size:12.5px;color:var(--ink-2)}
  #info .units{margin:14px 0 10px;display:flex;flex-direction:column;gap:3px;max-height:34vh;overflow:auto}
  #info .unit{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;font-size:12.5px;background:rgba(255,255,255,.04);cursor:default;transition:background .15s}
  #info .unit:hover,#info .unit.hov{background:rgba(255,198,112,.16)}
  #info .unit b{font-weight:600}
  #info .unit span{color:var(--ink-2);font-size:11.5px}
  #info .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--ink-2);padding:8px 2px 12px;border-top:1px solid var(--line)}
  #info .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  #info .row{display:flex;gap:6px}
  #info .row button{flex:1;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:9px;padding:8px 6px;font-size:12px;font-weight:500;transition:background .15s}
  #info .row button:hover{background:rgba(255,255,255,.12)}
  #info .row button.primary{background:var(--accent);color:#1b1408;border-color:transparent;font-weight:600}
  #info .row button.primary:hover{background:var(--accent-2)}
  #info .row button:disabled{opacity:.35;cursor:default}
  #info .kbd{margin-top:8px;font-size:10.5px;color:var(--ink-3);text-align:center}

  /* rotulos da planta */
  .rl{font-size:10.5px;line-height:1.2;text-align:center;color:#2a2621;background:rgba(255,253,248,.86);padding:3px 7px;border-radius:5px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18);opacity:0;transition:opacity .5s}
  .rl b{font-weight:600;display:block}
  .rl span{color:#6d655b;font-size:9.5px}
  .rl.sm{font-size:9.5px;padding:2px 5px}
  .al{font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;background:#1f2731;padding:4px 9px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3);opacity:0;transition:opacity .5s}
  .al em{font-style:normal;color:var(--accent);margin-left:4px;font-weight:600}
  .lbl-on .rl,.lbl-on .al{opacity:1}

  /* carregando */
  #load{position:fixed;inset:0;display:grid;place-items:center;background:#0d1015;z-index:10;transition:opacity .8s}
  #load.off{opacity:0;pointer-events:none}
  #load .box{text-align:center}
  #load .spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 14px}
  #load p{margin:0;font-size:13px;color:var(--ink-2)}
  #load pre{max-width:80vw;white-space:pre-wrap;color:#ff9a8a;font-size:12px;text-align:left}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:760px){
    #brand{left:12px;top:12px;padding:10px 12px}
    #brand h1{font-size:15px}
    #brand p{display:none}
    #time{right:12px;top:auto;bottom:12px}
    #time button span{display:none}
    #floors{right:12px;top:86px;transform:none;min-width:0;padding:6px;max-height:calc(100vh - 160px);overflow:auto}
    #floors .ttl,#floors button .l,#floors button .s{display:none}
    #floors button{padding:4px}
    #hint{display:none}
    #info{left:12px;right:70px;width:auto;bottom:64px;padding:14px}
    #info .units{max-height:22vh}
  }
</style>

} }
</script>

<body>
<div id="app"></div>
<div id="labels"></div>

<div id="brand" class="glass">
  <div class="eyebrow">Dom Club House</div>
  <h1>Torre Residencial</h1>
  <p>Protótipo interativo · cenário fictício</p>
</div>

<div id="time" class="glass">
  <button data-t="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Dia</span></button>
  <button data-t="dusk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 18a5 5 0 0 0-10 0M12 9V2M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1M16 5l-4 4-4-4"/></svg><span>Fim de tarde</span></button>
  <button data-t="night"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Noite</span></button>
</div>

<div id="floors" class="glass"><div class="ttl">Pavimentos</div></div>

<div id="hint" class="glass"><span class="dot"></span><span><b>Passe o mouse</b> sobre um andar e <b>clique</b> para ver a planta</span><span>· arraste para girar · role para zoom</span></div>

<div id="tip"></div>

<div id="info" class="glass">
  <div class="eyebrow" id="i-eyebrow"></div>
  <h2 id="i-title"></h2>
  <div class="sub" id="i-sub"></div>
  <div class="units" id="i-units"></div>
  <div class="legend" id="i-legend"></div>
  <div class="row">
    <button id="b-down" title="Andar abaixo (↓)">▼ Abaixo</button>
    <button id="b-up" title="Andar acima (↑)">▲ Acima</button>
    <button id="b-back" class="primary" title="Voltar (Esc)">Ver a torre</button>
  </div>
  <div class="kbd">Planta ilustrativa · divisões fictícias para teste</div>
</div>

<div id="load"><div class="box"><div class="spin"></div><p>Carregando a torre…</p></div></div>

const $ = s => document.querySelector(s);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(20261125);
const rand = (a, b) => a + (b - a) * rng();
const fmtArea = a => a.toFixed(1).replace('.', ',') + ' m²';
const isTouch = matchMedia('(pointer: coarse)').matches;

// animacoes (tweens) simples baseadas em promessa
const tweens = new Set();
function animate(dur, fn, ease = easeInOut, delay = 0) {
  return new Promise(res => tweens.add({ t0: performance.now() + delay, dur, fn, ease, res }));
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function stepTweens(now) {
  for (const tw of tweens) {
    if (now < tw.t0) continue;
    const p = clamp((now - tw.t0) / tw.dur, 0, 1);
    tw.fn(tw.ease(p));
    if (p >= 1) { tweens.delete(tw); tw.res(); }
  }
}

let MAX_ANISO = 8;
function canvasTex(w, h, draw, { srgb = true, repeat = true } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  return t;
}
function noise(g, w, h, n, colors, size = [1, 3], alpha = [0.05, 0.25]) {
  for (let i = 0; i < n; i++) {
    g.globalAlpha = rand(alpha[0], alpha[1]);
    g.fillStyle = colors[(rng() * colors.length) | 0];
    const s = rand(size[0], size[1]);
    g.fillRect(rng() * w, rng() * h, s, s);
  }
  g.globalAlpha = 1;
}

// fachadas dos predios vizinhos: 8 vaos x 8 andares por textura (24 m x 24 m)
const STYLES = [
  { wall: '#d7cab3', glass: ['#8597a8', '#2a3644'], kind: 'punched' },
  { wall: '#ecebe6', glass: ['#93abbf', '#31455a'], kind: 'ribbon' },
  { wall: '#3f4b57', glass: ['#a5bccf', '#2c3e50'], kind: 'curtain' },
  { wall: '#a8a59f', glass: ['#71879a', '#26313b'], kind: 'square' },
  { wall: '#b06a4f', glass: ['#7d8f9f', '#28323b'], kind: 'punched' },
  { wall: '#c9d0d3', glass: ['#7f9ab0', '#24384b'], kind: 'ribbon' },
];
function facadeTextures(st) {
  const N = 512, B = 8, bw = N / B, fh = N / B;
  const lit = [];
  const map = canvasTex(N, N, (g) => {
    g.fillStyle = st.wall; g.fillRect(0, 0, N, N);
    noise(g, N, N, 6000, ['#000', '#fff'], [1, 2], [0.02, 0.06]);
    for (let f = 0; f < B; f++) for (let b = 0; b < B; b++) {
      const x = b * bw, y = f * fh;
      let r;
      if (st.kind === 'punched') r = [x + bw * .2, y + fh * .22, bw * .6, fh * .56];
      else if (st.kind === 'square') r = [x + bw * .28, y + fh * .25, bw * .44, fh * .44];
      else if (st.kind === 'ribbon') r = [x, y + fh * .3, bw, fh * .46];
      else r = [x + 2, y + 2, bw - 4, fh * .78];
      const gr = g.createLinearGradient(0, r[1], 0, r[1] + r[3]);
      const k = rng();
      gr.addColorStop(0, st.glass[0]); gr.addColorStop(1, st.glass[1]);
      g.fillStyle = gr; g.fillRect(...r);
      if (k < .25) { g.fillStyle = 'rgba(235,228,210,.55)'; g.fillRect(r[0], r[1], r[2], r[3] * rand(.3, .9)); }
      g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(r[0], r[1] + r[3] - 2, r[2], 2);
      if (st.kind === 'ribbon' || st.kind === 'curtain') { g.fillStyle = 'rgba(30,30,30,.5)'; g.fillRect(x, r[1], 2, r[3]); }
      lit.push([r, rng()]);
    }
    if (st.kind === 'curtain') { g.fillStyle = 'rgba(20,24,28,.6)'; for (let f = 0; f < B; f++) g.fillRect(0, f * fh + fh * .8, N, fh * .2); }
  });
  const emissive = canvasTex(N, N, (g) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, N, N);
    for (const [r, k] of lit) {
      if (k > .36) continue;
      const warm = rng() < .75;
      const v = rand(.55, 1);
      g.fillStyle = warm ? `rgba(255,${(190 + 40 * v) | 0},${(120 + 40 * v) | 0},${v})` : `rgba(190,215,255,${v * .8})`;
      g.fillRect(...r);
    }
  });
  return { map, emissive };
}

/* =====================================================================
   geometria em espaco de mundo com UV de mundo
   ===================================================================== */
class GeoBuilder {
  constructor() { this.p = []; this.n = []; this.u = []; }
  quad(a, b, c, d, nrm, ua, ub, uc, ud) {
    for (const [v, uv] of [[a, ua], [b, ub], [c, uc], [a, ua], [c, uc], [d, ud]]) {
      this.p.push(v[0], v[1], v[2]); this.n.push(nrm[0], nrm[1], nrm[2]); this.u.push(uv[0], uv[1]);
    }
  }
  // caixa alinhada aos eixos (coordenadas three)
  box(x0, y0, z0, x1, y1, z1, T = 1, o = {}) {
    const { top = true, sides = true, bottom = false, uo = 0, vo = 0, topB = this } = o;
    if (top) topB.quad([x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0], [0, 1, 0],
      [x0 / T, -z1 / T], [x1 / T, -z1 / T], [x1 / T, -z0 / T], [x0 / T, -z0 / T]);
    if (bottom) this.quad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], [0, -1, 0],
      [x0 / T, z0 / T], [x1 / T, z0 / T], [x1 / T, z1 / T], [x0 / T, z1 / T]);
    if (!sides) return;

/* =====================================================================
   cidade ficticia
   ===================================================================== */
const XL = [], ZL = [];
for (let i = -7; i <= 7; i++) XL.push(33 + 70 * i);
for (let j = -7; j <= 7; j++) ZL.push(-23 + 70 * j);
const EXT = 520, ROAD = 10, WALK = 3;
const TOWER_BLOCK = { i: XL.indexOf(-37), j: ZL.indexOf(-23) };

function buildCity() {
  const asphaltMat = new THREE.MeshStandardMaterial({ map: TEX.asphalt, roughness: 0.92 });
  const paverMat = new THREE.MeshStandardMaterial({ map: TEX.pavers, roughness: 0.85 });
  const curbMat = new THREE.MeshStandardMaterial({ color: 0xa9a69f, roughness: 0.8 });
  const lotMat = po(new THREE.MeshStandardMaterial({ map: TEX.lot, roughness: 0.9 }), 1);
  const grassMat = po(new THREE.MeshStandardMaterial({ map: TEX.grass, roughness: 1 }), 1);
  const roofMat = new THREE.MeshStandardMaterial({ map: TEX.roof, roughness: 0.95 });
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x55603f, roughness: 1 });

  // chao distante
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05; ground.receiveShadow = true;
  scene.add(ground);

  // ruas: horizontais continuas, verticais em trechos
  const roads = new GeoBuilder();
  for (const z of ZL) roads.plane(-EXT, z - ROAD / 2, EXT, z + ROAD / 2, 0.04, 8);
  for (const x of XL) for (let j = 0; j < ZL.length - 1; j++) roads.plane(x - ROAD / 2, ZL[j] + ROAD / 2, x + ROAD / 2, ZL[j + 1] - ROAD / 2, 0.04, 8);
  for (const x of XL) { roads.plane(x - ROAD / 2, -EXT, x + ROAD / 2, ZL[0] - ROAD / 2, 0.04, 8); roads.plane(x - ROAD / 2, ZL.at(-1) + ROAD / 2, x + ROAD / 2, EXT, 0.04, 8); }
  scene.add(meshFrom(roads, asphaltMat));

  // faixas tracejadas e faixas de pedestre (instanciadas)
  const dashes = [];
  for (const z of ZL) for (let x = -EXT; x < EXT; x += 7) if (!XL.some(c => Math.abs(x - c) < 9)) dashes.push([x, z, 3, 0.16]);
  for (const x of XL) for (let z = -EXT; z < EXT; z += 7) if (!ZL.some(c => Math.abs(z - c) < 9)) dashes.push([x, z, 0.16, 3]);
  const zebra = (cx, cz, alongX) => { for (let k = -3; k <= 3; k++) dashes.push(alongX ? [cx + k * 0.95, cz, 0.5, 7.6] : [cx, cz + k * 0.95, 7.6, 0.5]); };
  zebra(-2, -23, true);
  for (const x of [-37, 33]) for (const z of [-23, 47]) { zebra(x, z - 8.5, true); zebra(x, z + 8.5, true); zebra(x - 8.5, z, false); zebra(x + 8.5, z, false); }
  const dashGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
  const dashMesh = new THREE.InstancedMesh(dashGeo, po(new THREE.MeshStandardMaterial({ color: 0xe9e6dc, roughness: 0.7 }), 2), dashes.length);
  const m4 = new THREE.Matrix4();
  dashes.forEach(([x, z, sx, sz], i) => dashMesh.setMatrixAt(i, m4.makeScale(sx, 1, sz).setPosition(x, 0.05, z)));
  dashMesh.receiveShadow = true;
  scene.add(dashMesh);

  // quadras
  const walks = new GeoBuilder(), curbs = new GeoBuilder(), lots = new GeoBuilder(), grass = new GeoBuilder(), roofs = new GeoBuilder();
  const fac = STYLES.map(() => new GeoBuilder());
  const treeSpots = [], lampSpots = [];
  for (let i = 0; i < XL.length - 1; i++) for (let j = 0; j < ZL.length - 1; j++) {
    const x0 = XL[i] + ROAD / 2, x1 = XL[i + 1] - ROAD / 2, z0 = ZL[j] + ROAD / 2, z1 = ZL[j + 1] - ROAD / 2;
    walks.box(x0, 0, z0, x1, 0.15, z1, 4, { sides: false });
    curbs.box(x0, 0, z0, x1, 0.15, z1, 1, { top: false });
    const ix0 = x0 + WALK, ix1 = x1 - WALK, iz0 = z0 + WALK, iz1 = z1 - WALK;
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, dist = Math.hypot(cx, cz);
    const di = i - TOWER_BLOCK.i, dj = j - TOWER_BLOCK.j;
    const isTower = di === 0 && dj === 0;
    // arvores e postes nas calcadas
    if (dist < 330) {
      for (let s = x0 + 6; s < x1 - 4; s += rand(14, 19)) { treeSpots.push([s, z0 + 1.2, 1]); treeSpots.push([s, z1 - 1.2, 1]); }
      for (let s = z0 + 6; s < z1 - 4; s += rand(14, 19)) { treeSpots.push([x0 + 1.2, s, 1]); treeSpots.push([x1 - 1.2, s, 1]); }
      for (let s = x0 + 12; s < x1 - 6; s += 30) { lampSpots.push([s, z0 + 0.5, 0]); lampSpots.push([s + 15, z1 - 0.5, Math.PI]); }
      for (let s = z0 + 12; s < z1 - 6; s += 30) { lampSpots.push([x0 + 0.5, s, -Math.PI / 2]); lampSpots.push([x1 - 0.5, s + 15, Math.PI / 2]); }
    }
    if (isTower) continue;
    const park = (di === 0 && dj === -1) || (di === 1 && dj === -1) || (dist > 120 && rng() < 0.1);
    if (park) {
      grass.plane(ix0, iz0, ix1, iz1, 0.152, 6);
      walks.plane(cx - 1.6, iz0, cx + 1.6, iz1, 0.158, 4);
      walks.plane(ix0, cz - 1.6, ix1, cz + 1.6, 0.159, 4);
      lots.box(cx - 6, 0.15, cz - 6, cx + 6, 0.35, cz + 6, 4);
      for (let k = 0; k < (dist < 330 ? (di === 0 && dj === -1 ? 12 : 26) : 0); k++) {
        const x = rand(ix0 + 2, ix1 - 2), z = rand(iz0 + 2, iz1 - 2);
        if (Math.abs(x - cx) < 3 || Math.abs(z - cz) < 3 || (Math.abs(x - cx) < 8 && Math.abs(z - cz) < 8)) continue;
        treeSpots.push([x, z, rand(1, 1.5)]);
      }
      continue;
    }
    lots.plane(ix0, iz0, ix1, iz1, 0.152, 6);
    // ate 4 predios por quadra
    const near = Math.max(Math.abs(di), Math.abs(dj)) <= 1;
    const cells = rng() < 0.3 ? [[ix0, iz0, ix1, iz1]] : [
      [ix0, iz0, cx, cz], [cx, iz0, ix1, cz], [ix0, cz, cx, iz1], [cx, cz, ix1, iz1]];
    for (const [a0, b0, a1, b1] of cells) {
      if (rng() < 0.12) continue;
      const w = a1 - a0, d = b1 - b0;
      const bw = w * rand(0.55, 0.85), bd = d * rand(0.55, 0.85);
      const bx = a0 + rand(1.5, Math.max(1.6, w - bw - 1.5)), bz = b0 + rand(1.5, Math.max(1.6, d - bd - 1.5));
      let floors = near ? Math.round(rand(2, 6)) : dist < 200 ? Math.round(rand(3, 10)) : Math.round(rand(4, 16));
      if (dist > 230 && rng() < 0.18) floors = Math.round(rand(18, 36));
      if (di === 1 && dj === -1) floors = Math.min(floors, 4);
      const H = floors * 3 + 0.15;
      const st = (rng() * STYLES.length) | 0;
      fac[st].box(bx, 0.15, bz, bx + bw, H, bz + bd, 24, { top: false, uo: ((rng() * 8) | 0) * 3, vo: 0.15 });
      roofs.box(bx - 0.25, H, bz - 0.25, bx + bw + 0.25, H + 0.9, bz + bd + 0.25, 6, { top: true });
      if (floors > 6) {  // casa de maquinas
        const mw = Math.min(bw * 0.35, 7), md = Math.min(bd * 0.3, 6);
        const mx = bx + bw / 2 - mw / 2 + rand(-2, 2), mz = bz + bd / 2 - md / 2 + rand(-2, 2);
        roofs.box(mx, H, mz, mx + mw, H + 3.2, mz + md, 6);
      }
    }
  }
  scene.add(meshFrom(walks, paverMat), meshFrom(curbs, curbMat), meshFrom(lots, lotMat), meshFrom(grass, grassMat));
  const roofMesh = meshFrom(roofs, roofMat, { cast: true }); scene.add(roofMesh);
  STYLES.forEach((st, k) => {
    if (fac[k].empty) return;
    const { map, emissive } = facadeTextures(st);
    const mat = new THREE.MeshStandardMaterial({ map, emissiveMap: emissive, emissive: 0xffffff, emissiveIntensity: 0, roughness: st.kind === 'curtain' ? 0.35 : 0.8, metalness: st.kind === 'curtain' ? 0.3 : 0 });
    mat.userData.nightI = 1.15; nightMats.push(mat);

  });

  buildTowerLot(treeSpots);
  buildTrees(treeSpots);
  buildLamps(lampSpots);
  buildCars();
}

function buildTrees(spots) {

function buildCars() {

  const c = new THREE.Color();

  for (let i = 0; i < N; i++) {

function mergeGeos(list) {
  const out = new GeoBuilder();
  for (let g of list) { g = g.index ? g.toNonIndexed() : g; const p = g.attributes.position, n = g.attributes.normal; for (let i = 0; i < p.count; i++) { out.p.push(p.getX(i), p.getY(i), p.getZ(i)); out.n.push(n.getX(i), n.getY(i), n.getZ(i)); out.u.push(0, 0); } }

const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _one = new THREE.Vector3(1, 1, 1), _Y = new THREE.Vector3(0, 1, 0);
function updateCars(dt) {
  if (!carMeshes) return;
  cars.forEach((car, i) => {
    car.s += car.v * dt * car.lane.dir;
    if (car.s > EXT) car.s -= 2 * EXT; if (car.s < -EXT) car.s += 2 * EXT;
    const L = car.lane;
    if (L.ax === 'x') { _p.set(car.s, 0.04, L.c); _q.setFromAxisAngle(_Y, L.dir > 0 ? 0 : Math.PI); }
    else { _p.set(L.c, 0.04, car.s); _q.setFromAxisAngle(_Y, L.dir > 0 ? -Math.PI / 2 : Math.PI / 2); }
    _m.compose(_p, _q, _one);
    for (const m of carMeshes) m.setMatrixAt(i, _m);

}

function makeGlassMat() {
  const m = new THREE.MeshStandardMaterial({ color: 0x1e2a33, roughness: 0.06, metalness: 0.88, emissive: 0xffb466, envMapIntensity: 1.1 });
  const uLit = { value: 0 };

  m.onBeforeCompile = (sh) => {
    sh.uniforms.uLit = m.userData.uLit; sh.uniforms.uNight = U.night;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nattribute float aRand;\nvarying float vRand;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvRand = aRand;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uLit;\nuniform float uNight;\nvarying float vRand;')
      .replace('#include <emissivemap_fragment>', `
        float nOn = step(vRand, 0.4) * uNight;
        float vari = 0.55 + 0.9 * fract(vRand * 13.71);
        vec3 tint = mix(vec3(1.0), vec3(0.72, 0.86, 1.2), step(0.78, fract(vRand * 5.31)));
        float lvl = max(uLit * 7.0, nOn * 1.5 * vari);

function addWindowRandom(geo) {
  const pos = geo.attributes.position, n = pos.count;
  const par = new Int32Array(n); for (let i = 0; i < n; i++) par[i] = i;
  const find = i => { while (par[i] !== i) { par[i] = par[par[i]]; i = par[i]; } return i; };
  const uni = (a, b) => { a = find(a); b = find(b); if (a !== b) par[a] = b; };
  const seen = new Map();
  for (let i = 0; i < n; i++) {
    const k = `${Math.round(pos.getX(i) * 40)}|${Math.round(pos.getY(i) * 40)}|${Math.round(pos.getZ(i) * 40)}`;
    if (seen.has(k)) uni(i, seen.get(k)); else seen.set(k, i);
  }
  const idx = geo.index ? geo.index.array : null;
  const tc = idx ? idx.length : n;
  for (let t = 0; t < tc; t += 3) { const a = idx ? idx[t] : t, b = idx ? idx[t + 1] : t + 1, c = idx ? idx[t + 2] : t + 2; uni(a, b); uni(b, c); }
  const acc = new Map();
  for (let i = 0; i < n; i++) { const r = find(i); const a = acc.get(r) || [0, 0, 0, 0]; a[0] += pos.getX(i); a[1] += pos.getY(i); a[2] += pos.getZ(i); a[3]++; acc.set(r, a); }
  const nrm = geo.attributes.normal;
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = acc.get(find(i));
    const key = Math.floor(a[0] / a[3] / 3.2) * 73856093 ^ Math.floor(a[2] / a[3] / 3.2) * 19349663 ^ Math.floor(a[1] / a[3] / 2.8) * 83492791 ^ (Math.round(nrm.getX(i) * 2) * 7 + Math.round(nrm.getZ(i) * 2)) * 2971;
    const r = mulberry32(key)(); out[i] = r;
  }
  geo.setAttribute('aRand', new THREE.BufferAttribute(out, 1));
}

function buildTower(gltf) {
  const tower = new THREE.Group(); scene.add(tower);
  const meshes = [];
  gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse(o => { if (o.isMesh) meshes.push(o); });
  for (let i = 0; i < 10; i++) {
    const key = Object.keys(FLOORS).find(k => k.startsWith(String(i).padStart(2, '0')));
    const data = FLOORS[key];
    const g = new THREE.Group(); tower.add(g);
    const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e5);
    const facadeMat = facadeBase.clone(); facadeMat.clippingPlanes = [clip]; facadeMat.clipShadows = true;
    const glassMat = makeGlassMat(); glassMat.clippingPlanes = [clip]; glassMat.clipShadows = true;
    const pocheMat = new THREE.MeshBasicMaterial({ color: 0x2e2b27, side: THREE.BackSide, clippingPlanes: [clip] });
    const floorY = i === 0 ? 0.17 : i === 9 ? data.zmin + 0.25 : data.zmin + 0.15;
    const fl = { idx: i, name: FLOOR_NAMES[i], data, group: g, clip, facadeMat, glassMat, pocheMat, floorY, zmax: data.zmax, meshes: [], poche: [], shown: true, hover: 0, hoverT: 0, plan: null };
    // centro pela projecao
    let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
    for (const r of data.foot) { bx0 = Math.min(bx0, r[0]); by0 = Math.min(by0, r[1]); bx1 = Math.max(bx1, r[2]); by1 = Math.max(by1, r[3]); }
    fl.bbox = [bx0, by0, bx1, by1];
    fl.center = toThree((bx0 + bx1) / 2, (by0 + by1) / 2, floorY);
    floors.push(fl);
    for (const m of meshes) {
      let p = m; while (p && !/^\d\d/.test(p.name)) p = p.parent;
      if (!p || parseInt(p.name.slice(0, 2)) !== i) continue;
      const isGlass = m.material && m.material.name === 'GLASS';
      g.attach(m);
      if (isGlass) addWindowRandom(m.geometry);
      m.material = isGlass ? glassMat : facadeMat;
      m.castShadow = m.receiveShadow = true;
      m.userData.floor = i;
      fl.meshes.push(m); hoverables.push(m);
      const pm = new THREE.Mesh(m.geometry, pocheMat); pm.visible = false; pm.position.copy(m.position); pm.quaternion.copy(m.quaternion); pm.scale.copy(m.scale);
      g.add(pm); fl.poche.push(pm);

    if (i > 0) {
      const sb = new GeoBuilder(); const top = i === 9 ? data.zmin + 0.24 : data.zmin + 0.14;
      for (const r of data.foot) sb.box(r[0], data.zmin + 0.01, -r[3], r[2], top, -r[1], 1, { top: true, sides: false });

function buildPlan(fl) {
  const def = planDef(fl.idx);
  const mask = fl.data[def.mask];
  const inside = (x, y) => mask.some(r => x > r[0] && x < r[2] && y > r[1] && y < r[3]);
  const y0 = fl.floorY, cutH = 1.1;
  const group = new THREE.Group(); group.visible = false;
  const raise = new THREE.Group(); raise.position.y = y0; group.add(raise);
  // pecas recortadas pela mascara
  const pieces = [];
  const isect = (r, m) => [Math.max(r[0], m[0]), Math.max(r[1], m[1]), Math.min(r[2], m[2]), Math.min(r[3], m[3])];
  const minus = (r, m) => {
    const a = isect(r, m); if (a[2] - a[0] <= 1e-4 || a[3] - a[1] <= 1e-4) return [r];
    return [[r[0], r[1], r[2], a[1]], [r[0], a[3], r[2], r[3]], [r[0], a[1], a[0], a[3]], [a[2], a[1], r[2], a[3]]].filter(p => p[2] - p[0] > 1e-4 && p[3] - p[1] > 1e-4);
  };
  def.rooms.forEach((room, id) => {
    room.pieces = [];
    if (room.outside) {
      let ps = [];
      for (const r of room.r) for (const m of fl.data.foot) { const a = isect(r, m); if (a[2] - a[0] > 0.04 && a[3] - a[1] > 0.04) ps.push(a); }
      for (const m of fl.data.interior) ps = ps.flatMap(p => minus(p, m));
      ps = ps.filter(p => Math.min(p[2] - p[0], p[3] - p[1]) > 0.75);
      for (const a of ps) { room.pieces.push(a); pieces.push({ id, r: a }); }
    } else for (const r of room.r) for (const m of mask) {
      const a = isect(r, m);
      if (a[2] - a[0] > 0.04 && a[3] - a[1] > 0.04) { room.pieces.push(a); pieces.push({ id, r: a }); }
    }
    room.area = room.pieces.reduce((s, a) => s + (a[2] - a[0]) * (a[3] - a[1]), 0);
  });
  const roomAt = (x, y) => { for (const p of pieces) if (x > p.r[0] && x < p.r[2] && y > p.r[1] && y < p.r[3]) return p.id; return -1; };
  // pisos
  const finB = {};
  for (const room of def.rooms) {
    const b = finB[room.f] || (finB[room.f] = new GeoBuilder());
    for (const a of room.pieces) b.plane(a[0], -a[3], a[2], -a[1], y0 + 0.006, FIN[room.f].T);
  }
  for (const k in finB) {
    const m = meshFrom(finB[k], new THREE.MeshStandardMaterial({ map: TEX[FIN[k].tex], roughness: k === 'wood' ? 0.55 : 0.4, color: FIN[k].c }));
    group.add(m);
  }
  // paredes: fronteiras entre comodos diferentes, menos portas
  const lines = new Map();
  const addLine = (dir, c, a, b) => { const k = dir + (Math.round(c * 100) / 100).toFixed(2); const l = lines.get(k) || { dir, c: Math.round(c * 100) / 100, iv: [] }; l.iv.push([a, b]); lines.set(k, l); };
  for (const p of pieces) { const [x0, yy0, x1, yy1] = p.r; addLine('h', yy0, x0, x1); addLine('h', yy1, x0, x1); addLine('v', x0, yy0, yy1); addLine('v', x1, yy0, yy1); }
  const walls = new GeoBuilder(), tops = new GeoBuilder();
  const TH = 0.12, STEP = 0.05;
  for (const l of lines.values()) {
    l.iv.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const iv of l.iv) { const last = merged.at(-1); if (last && iv[0] <= last[1] + 1e-3) last[1] = Math.max(last[1], iv[1]); else merged.push([...iv]); }
    const ds = def.doors.filter(d => d[2] === l.dir && Math.abs((l.dir === 'h' ? d[1] : d[0]) - l.c) < 0.03);
    for (const [a, b] of merged) {
      let run = null;
      const flush = () => {
        if (!run) return;
        const s0 = run[0] - 0.06, s1 = run[1] + 0.06;
        if (l.dir === 'h') { walls.box(s0, y0, -l.c - TH / 2, s1, y0 + cutH, -l.c + TH / 2, 1, { top: false }); tops.plane(s0, -l.c - TH / 2, s1, -l.c + TH / 2, y0 + cutH + 0.002, 1); }
        else { walls.box(l.c - TH / 2, y0, -s1, l.c + TH / 2, y0 + cutH, -s0, 1, { top: false }); tops.plane(l.c - TH / 2, -s1, l.c + TH / 2, -s0, y0 + cutH + 0.002, 1); }
        run = null;
      };
      for (let s = a + STEP / 2; s < b; s += STEP) {
        const [px, py, nx, ny] = l.dir === 'h' ? [s, l.c, 0, 1] : [l.c, s, 1, 0];
        const A = roomAt(px + nx * 0.08, py + ny * 0.08), B = roomAt(px - nx * 0.08, py - ny * 0.08);
        let wall = A >= 0 && B >= 0 && A !== B && !def.rooms[A].outside && !def.rooms[B].outside;
        if (wall && ds.some(d => Math.abs(s - (l.dir === 'h' ? d[0] : d[1])) < d[3] / 2)) wall = false;
        if (wall) { if (run) run[1] = s + STEP / 2; else run = [s - STEP / 2, s + STEP / 2]; } else flush();
      }
      flush();
    }
  }
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xf3f0ea, roughness: 0.9 });
  const wm = meshFrom(walls, wallMat, { cast: true }); raise.add(wm); wm.position.y = -y0;
  const tm = meshFrom(tops, new THREE.MeshBasicMaterial({ color: 0x2e2b27 })); raise.add(tm); tm.position.y = -y0;
  // moveis
  const fb = {};
  for (const [x0, yy0, x1, yy1, h, c] of def.furn) {
    if (roomAt((x0 + x1) / 2, (yy0 + yy1) / 2) < 0) continue;
    (fb[c] || (fb[c] = new GeoBuilder())).box(x0, y0 + 0.006, -yy1, x1, y0 + 0.006 + h, -yy0, 1);
  }
  for (const c in fb) {
    const mat = new THREE.MeshStandardMaterial({ color: FURN_C[c], roughness: c === 'shower' ? 0.1 : 0.7, metalness: c === 'solar' ? 0.5 : 0 });
    const m = meshFrom(fb[c], mat, { cast: true }); m.position.y = -y0; raise.add(m);
  }
  // rotulos e destaques por unidade
  const units = new Map();
  for (const room of def.rooms) {
    if (!room.pieces.length) continue;
    const big = room.pieces.reduce((a, b) => (b[2] - b[0]) * (b[3] - b[1]) > (a[2] - a[0]) * (a[3] - a[1]) ? b : a);
    const el = document.createElement('div'); el.className = 'rl' + (room.small ? ' sm' : '');
    el.innerHTML = `<b>${room.n}</b><span>${fmtArea(room.area)}</span>`;
    const lab = new CSS2DObject(el); lab.position.copy(toThree((big[0] + big[2]) / 2, (big[1] + big[3]) / 2, y0 + cutH + 0.3));
    group.add(lab);
    if (room.unit) { const u = units.get(room.unit) || { name: room.unit, area: 0, rooms: [], pieces: [] }; u.area += room.area; u.rooms.push(room.n); u.pieces.push(...room.pieces); units.set(room.unit, u); }
  }
  for (const a of def.apts || []) {
    const u = units.get(a.unit);
    const el = document.createElement('div'); el.className = 'al';
    el.innerHTML = `${a.unit.replace('Apto ', 'APTO ')}<em>${fmtArea(u.area)}</em>`;
    const lab = new CSS2DObject(el); lab.position.copy(toThree(a.at[0], a.at[1], y0 + cutH + 0.6)); group.add(lab);
  }
  const hiMat = () => new THREE.MeshBasicMaterial({ color: 0xffc670, transparent: true, opacity: 0, depthWrite: false });
  for (const u of units.values()) {
    const b = new GeoBuilder(); for (const a of u.pieces) b.plane(a[0], -a[3], a[2], -a[1], y0 + 0.02, 1);
    u.mesh = new THREE.Mesh(b.build(), hiMat()); u.mesh.userData.unit = u; u.mesh.renderOrder = 3; group.add(u.mesh);
  }
  // luzes internas (acesas no modo planta)
  scene.add(group);
  fl.plan = { group, raise, def, units: [...units.values()], unitMeshes: [...units.values()].map(u => u.mesh) };
  return fl.plan;
}

let state = 'intro';      // intro | tower | busy | plan
let current = -1;         // andar aberto

let hoveredUnit = null;
let savedView = null;

for (let k = 0; k < 5; k++) { const l = new THREE.PointLight(0xffd7a3, 0, 12, 1.6); scene.add(l); interiorLights.push(l); }

const tip = $('#tip');
function showTip(html, x, y) { tip.innerHTML = html; tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('on'); }
function hideTip() { tip.classList.remove('on'); }
function floorSub(i) { return i === 0 ? 'Lazer e áreas comuns' : i === 9 ? 'Áreas técnicas' : '4 apartamentos · 2 dorm.'; }

function setHover(i) {
  if (i === hovered) return;
  hovered = i;
  floors.forEach(f => f.hoverT = f.idx === i ? 1 : 0);
  outline.selectedObjects = i >= 0 ? floors[i].meshes : [];
  document.querySelectorAll('#floors button').forEach(b => b.classList.toggle('hov', +b.dataset.i === i));
  renderer.domElement.style.cursor = i >= 0 ? 'pointer' : '';
}
function setUnitHover(u) {
  if (u === hoveredUnit) return;
  hoveredUnit = u;
  if (current >= 0 && floors[current].plan) for (const x of floors[current].plan.units) x.hiT = x === u ? 0.45 : 0;
  document.querySelectorAll('#i-units .unit').forEach(el => el.classList.toggle('hov', u && el.dataset.u === u.name));
  renderer.domElement.style.cursor = u ? 'pointer' : '';
}

function setFloorShown(f, shown, rank = 0) {
  if (f.shown === shown) return Promise.resolve();
  f.shown = shown;
  const mats = [f.facadeMat, f.glassMat, f.slab?.material].filter(Boolean);
  mats.forEach(m => { m.transparent = true; m.needsUpdate = true; });
  f.group.visible = true;
  const lift = 9 + rank * 2.2;
  return animate(shown ? 900 : 800, e => {
    const k = shown ? 1 - e : e;
    mats.forEach(m => m.opacity = 1 - k);
    f.group.position.y = k * lift;
  }, shown ? easeOut : easeInOut, rank * 70).then(() => {
    if (!shown) f.group.visible = false;
    else mats.forEach(m => { m.transparent = false; m.opacity = 1; m.needsUpdate = true; });
  });
}

function setLit(f, on, dur = 1200) {
  const u = f.glassMat.userData.uLit, from = u.value, to = on ? 1 : 0;
  return animate(dur, e => u.value = lerp(from, to, e), easeOut);
}

function camTo(pos, target, dur = 1800, ease = easeInOut) {
  const t0 = controls.target.clone(), p0 = camera.position.clone();
  const s0 = new THREE.Spherical().setFromVector3(p0.clone().sub(t0));
  const s1 = new THREE.Spherical().setFromVector3(pos.clone().sub(target));
  let dT = s1.theta - s0.theta; dT = ((dT + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  const s = new THREE.Spherical(), t = new THREE.Vector3();
  return animate(dur, e => {
    t.copy(t0).lerp(target, e);
    s.set(lerp(s0.radius, s1.radius, e), lerp(s0.phi, s1.phi, e), s0.theta + dT * e);
    camera.position.setFromSpherical(s).add(t);
    controls.target.copy(t); camera.lookAt(t);
  }, ease);
}

function planFrame(f) {
  const [x0, y0, x1, y1] = f.bbox;
  const w = x1 - x0 + 4, h = y1 - y0 + 4;
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2;
  const sidePanel = innerWidth > 760 ? 1.28 : 1.05;
  const r = Math.max(h / (2 * Math.tan(vf)), (w * sidePanel) / (2 * Math.tan(vf) * camera.aspect)) * 1.08;
  const target = f.center.clone();
  if (innerWidth > 760) target.x -= w * 0.06;
  const pos = target.clone().add(new THREE.Vector3().setFromSpherical(new THREE.Spherical(r, 0.2, 0)));
  return { pos, target };
}

async function openFloor(i) {
  if (state === 'busy' || state === 'intro' || i === current) return;
  const from = state, prev = current;
  state = 'busy'; controls.enabled = false;
  setHover(-1); setUnitHover(null); hideTip();
  const f = floors[i];
  if (!f.plan) buildPlan(f);
  if (from === 'tower') {
    savedView = { pos: camera.position.clone(), target: controls.target.clone() };
    $('#hint').style.opacity = 0;
    // 1) aproxima do andar e acende as luzes
    const tgt = f.center.clone().setY(f.floorY + 1.4);
    const sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    const pos = tgt.clone().add(new THREE.Vector3().setFromSpherical(new THREE.Spherical(46, 1.38, sph.theta)));
    focusBloom = 0.25;
    await Promise.all([camTo(pos, tgt, 1700), setLit(f, true, 1500).then(() => 0)]);
    await wait(650);
  } else {
    closePlanUI(prev);
    setLit(floors[prev], false, 600);
    setLit(f, true, 800);
  }
  current = i;
  updateFloorList();
  // 2) remove os andares de cima, corta o andar e olha de cima
  const ups = [];
  floors.forEach(g => { if (g.idx > i) ups.push(setFloorShown(g, false, g.idx - i)); else if (g.idx <= i) ups.push(setFloorShown(g, true, 0)); });
  floors.forEach(g => { if (g.idx !== i) { g.clip.constant = 1e5; g.poche.forEach(p => p.visible = false); } });
  f.poche.forEach(p => p.visible = true);
  const cTop = f.zmax + 0.5, cCut = f.floorY + 1.1;
  f.clip.constant = cTop;
  const cutA = animate(1500, e => f.clip.constant = lerp(cTop, cCut, e), easeInOut, from === 'tower' ? 350 : 0);
  gtao.enabled = false;
  const fr = planFrame(f);
  const camA = camTo(fr.pos, fr.target, from === 'tower' ? 2100 : 1400);
  const plan = f.plan;
  plan.group.visible = true; plan.raise.scale.y = 0.001;
  const rise = animate(1100, e => plan.raise.scale.y = Math.max(e, 0.001), easeOut, from === 'tower' ? 1000 : 400);
  // luzes internas
  const lp = [[-5.5, 4.5], [5.5, 4.5], [5.5, -4.5], [-5.5, -4.5], [0, 0]];
  interiorLights.forEach((l, k) => l.position.copy(toThree(lp[k][0], lp[k][1], f.floorY + 2.4)));
  animate(1200, e => interiorLights.forEach(l => l.intensity = e * (6 + 22 * TS.night)), easeOut, 600);
  await Promise.all([...ups, cutA, camA, rise]);
  $('#labels').classList.add('lbl-on');
  openPlanUI(i);
  focusBloom = 0.15; applyTime(false);
  controls.enabled = true; controls.enablePan = false;
  controls.minDistance = 10; controls.maxDistance = 120; controls.maxPolarAngle = 1.15;
  state = 'plan';
}

async function backToTower() {
  if (state !== 'plan') return;
  state = 'busy'; controls.enabled = false;
  setUnitHover(null); hideTip();
  const f = floors[current];
  closePlanUI(current);
  $('#labels').classList.remove('lbl-on');
  const plan = f.plan;
  const lower = animate(600, e => plan.raise.scale.y = Math.max(1 - e, 0.001)).then(() => plan.group.visible = false);
  animate(700, e => interiorLights.forEach(l => l.intensity *= (1 - e)));
  const cTop = f.zmax + 0.5, cCut = f.clip.constant;
  const cutA = animate(1300, e => f.clip.constant = lerp(cCut, cTop, e), easeInOut, 300).then(() => { f.clip.constant = 1e5; f.poche.forEach(p => p.visible = false); });
  const ups = floors.filter(g => !g.shown).map(g => setFloorShown(g, true, (g.idx - current) * 0.6));
  const v = savedView || { pos: new THREE.Vector3(48, 22, -62), target: new THREE.Vector3(0, 13, 0) };
  const camA = camTo(v.pos, v.target, 2000);
  setLit(f, false, 2200);
  await Promise.all([lower, cutA, camA, ...ups]);
  interiorLights.forEach(l => l.intensity = 0);
  gtao.enabled = true;
  focusBloom = 0; applyTime(false);
  current = -1; updateFloorList();
  controls.enabled = true; controls.enablePan = true;
  controls.minDistance = 14; controls.maxDistance = 460; controls.maxPolarAngle = 1.5;
  $('#hint').style.opacity = 1;
  state = 'tower';
}

/* ---------- UI ---------- */
function buildFloorList() {
  const box = $('#floors');
  for (let i = 9; i >= 0; i--) {
    const b = document.createElement('button'); b.dataset.i = i;
    b.innerHTML = `<span class="n">${FLOOR_SHORT[i]}</span><span class="l">${FLOOR_NAMES[i]}</span>`;
    b.onmouseenter = () => { if (state === 'tower') setHover(i); };
    b.onmouseleave = () => { if (state === 'tower') setHover(-1); };
    b.onclick = () => openFloor(i);
    box.appendChild(b);
  }
}
function updateFloorList() { document.querySelectorAll('#floors button').forEach(b => b.classList.toggle('sel', +b.dataset.i === current)); }
function openPlanUI(i) {
  const f = floors[i], def = f.plan.def;
  $('#i-eyebrow').textContent = def.eyebrow;
  $('#i-title').textContent = f.name;
  $('#i-sub').textContent = def.kind;
  const units = f.plan.units;
  $('#i-units').innerHTML = units.map(u => {
    const meta = u.name.startsWith('Apto') ? `${u.rooms.includes('Suíte') ? '2 dorm. (1 suíte)' : ''} · ${fmtArea(u.area)}` : fmtArea(u.area);
    return `<div class="unit" data-u="${u.name}"><b>${u.name}</b><span>${meta}</span></div>`;
  }).join('');
  document.querySelectorAll('#i-units .unit').forEach(el => {
    const u = units.find(x => x.name === el.dataset.u);
    el.onmouseenter = () => setUnitHover(u); el.onmouseleave = () => setUnitHover(null);
  });
  const fins = [...new Set(def.rooms.filter(r => r.pieces.length).map(r => r.f))];
  $('#i-legend').innerHTML = fins.map(k => `<span><i style="background:${FIN[k].legend[0]}"></i>${FIN[k].legend[1]}</span>`).join('');
  $('#b-up').disabled = i >= 9; $('#b-down').disabled = i <= 0;
  $('#info').classList.add('on');
}
function closePlanUI(i) {
  $('#info').classList.remove('on');
  if (i >= 0 && floors[i].plan) {
    const p = floors[i].plan;
    p.group.visible = false;
    p.units.forEach(u => { u.hiT = 0; u.mesh.material.opacity = 0; });
  }
}
$('#b-back').onclick = backToTower;
$('#b-up').onclick = () => { if (state === 'plan' && current < 9) openFloor(current + 1); };
$('#b-down').onclick = () => { if (state === 'plan' && current > 0) openFloor(current - 1); };
document.querySelectorAll('#time button').forEach(b => b.onclick = () => { if (b.dataset.t !== timeName) setTime(b.dataset.t); });
addEventListener('keydown', e => {
  if (e.key === 'Escape') backToTower();
  if (state === 'plan' && e.key === 'ArrowUp' && current < 9) openFloor(current + 1);
  if (state === 'plan' && e.key === 'ArrowDown' && current > 0) openFloor(current - 1);
});

/* ---------- picking ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
function pick(ev) {
  ndc.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
renderer.domElement.addEventListener('pointermove', ev => {
  if (ev.pointerType === 'touch') return;
  pick(ev);
  if (state === 'tower') {
    const hit = ray.intersectObjects(hoverables.filter(m => floors[m.userData.floor].shown), false)[0];
    const i = hit ? hit.object.userData.floor : -1;
    setHover(i);
    if (i >= 0) showTip(`<b>${FLOOR_NAMES[i]}</b><span>${floorSub(i)}</span><i>Clique para ver a planta</i>`, ev.clientX, ev.clientY);
    else hideTip();
  } else if (state === 'plan') {
    const hit = ray.intersectObjects(floors[current].plan.unitMeshes, false)[0];
    const u = hit ? hit.object.userData.unit : null;
    setUnitHover(u);
    if (u) showTip(`<b>${u.name}</b><span>${fmtArea(u.area)}${u.name.startsWith('Apto') ? ' · 2 dorm. (1 suíte)' : ''}</span>`, ev.clientX, ev.clientY);
    else hideTip();
  }
});
renderer.domElement.addEventListener('pointerleave', () => { if (state === 'tower') setHover(-1); setUnitHover(null); hideTip(); });
renderer.domElement.addEventListener('pointerdown', ev => downAt = [ev.clientX, ev.clientY]);
renderer.domElement.addEventListener('pointerup', ev => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 6) return;
  if (state !== 'tower') return;
  pick(ev);
  const hit = ray.intersectObjects(hoverables.filter(m => floors[m.userData.floor].shown), false)[0];
  if (hit) openFloor(hit.object.userData.floor);
});

/* =====================================================================
   loop
   ===================================================================== */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();
  stepTweens(now);
  updateCars(dt);
  for (const f of floors) {
    f.hover += (f.hoverT - f.hover) * Math.min(1, dt * 12);
    f.facadeMat.emissiveIntensity = f.hover * 0.32;
  }
  if (current >= 0 && floors[current].plan) for (const u of floors[current].plan.units) { u.mesh.material.opacity += ((u.hiT || 0) - u.mesh.material.opacity) * Math.min(1, dt * 12); }
  if (lampPool) lampPool.opacity = 0.38 * TS.night;
  if (controls.enabled) { controls.update(); if (controls.target.y < 0) controls.target.y = 0; }
  composer.render();
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

/* =====================================================================
   inicio
   ===================================================================== */
async function init() {
  makeTextures();
  mixPreset(PRESETS.dusk, PRESETS.dusk, 1); applyTime(true);
  document.querySelectorAll('#time button').forEach(b => b.classList.toggle('on', b.dataset.t === timeName));
  buildCity();
  const bin = Uint8Array.from(atob(GLB_B64), c => c.charCodeAt(0)).buffer;
  const gltf = await new Promise((res, rej) => new GLTFLoader().parse(bin, '', res, rej));
  buildTower(gltf);
  buildFloorList();
  applyTime(true);
  requestAnimationFrame(frame);
  await wait(250);
  $('#load').classList.add('off');
  await camTo(new THREE.Vector3(48, 22, -62), new THREE.Vector3(0, 13, 0), 3600, easeInOut);
  controls.enabled = true;
  state = 'tower';
  window.__ready = true;
}
window.__debug = { openFloor, backToTower, setTime, floors, lit: (i, v = 1) => { floors[i].glassMat.userData.uLit.value = v; focusBloom = v ? 0.25 : 0; applyTime(false); }, cam: (p, t) => { camera.position.set(...p); controls.target.set(...t); camera.lookAt(...t); }, get state() { return state; } };
init().catch(err => { console.error(err); $('#load .box').innerHTML = `<p>Não foi possível carregar a cena.</p><pre>${err && (err.stack || err.message || err)}</pre>`; });
</script>
</body>
